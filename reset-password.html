<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Your Password — NurtureT</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #FFF7F2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
    box-sizing: border-box;
  }
  .card {
    max-width: 400px;
    text-align: center;
    background: #FFFFFF;
    border-radius: 20px;
    padding: 40px 28px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
  }
  .emoji { font-size: 48px; margin-bottom: 8px; }
  h1 { font-size: 22px; color: #1F2937; margin: 0 0 12px; }
  p { font-size: 15px; color: #4B5563; line-height: 1.5; margin: 0 0 24px; }
  .btn {
    display: inline-block;
    background: #2D6A4F;
    color: #FFFFFF;
    text-decoration: none;
    font-size: 16px;
    font-weight: 600;
    padding: 14px 28px;
    border-radius: 12px;
  }
  .hint {
    font-size: 13px;
    color: #9CA3AF;
    margin-top: 20px;
    margin-bottom: 0;
    line-height: 1.5;
  }
  .brand { font-size: 13px; color: #9CA3AF; margin-top: 28px; letter-spacing: 0.5px; }
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">🔑</div>
    <h1>Reset your password</h1>
    <p>Tap the button below to open NurtureT and choose a new password.</p>
    <a id="open-app-btn" class="btn" href="#">Open NurtureT</a>
    <p class="hint">
      Nothing happen? Make sure you're opening this link on the phone
      where the NurtureT app is installed, then tap the button again.
    </p>
    <div class="brand">NURTURET</div>
  </div>

  <script>
    // Supabase's /auth/v1/verify redirect appends the recovery
    // token as a URL FRAGMENT (#access_token=...&refresh_token=...
    // &type=recovery), never as a query string — fragments are
    // never sent to any server, purely client-side, which is why
    // this has to be read and forwarded here in JS rather than on
    // Supabase's or Vercel's server side. This page's only real job
    // is: take whatever fragment we were opened with and hand it,
    // completely unchanged, to the app's own deep link — the app
    // (see RootNavigator.tsx / ResetPasswordScreen.tsx) already
    // knows how to parse both the success shape
    // (#access_token=...&type=recovery) and the error shape
    // (#error=access_denied&error_code=otp_expired&...) on its own;
    // this page does not need to and does not try to understand
    // which one it is.
    var hash = window.location.hash; // includes leading "#", or ""
    var target = "nurturet://reset-password" + hash;

    var btn = document.getElementById("open-app-btn");
    btn.href = target;

    // Best-effort automatic hand-off, for the browsers that allow a
    // programmatic redirect to a custom scheme without a tap (mainly
    // some Android browsers). Deliberately NOT relied upon as the
    // only mechanism -- Safari and several Android browsers block
    // this specific kind of redirect unless it comes from a real
    // user gesture, which is exactly what the visible button above
    // is for. If this line does nothing on a given browser, the
    // button still works.
    window.location.href = target;
  </script>
</body>
</html>
